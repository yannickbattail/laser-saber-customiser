<!doctype html>
<html lang="fr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />

    <meta name="description" content="Build and customise your own lightsaber." />

    <!-- Open Graph: Facebook, LinkedIn, WhatsApp, Discord, Slack, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lightsaber.darthperious.top/" />
    <meta property="og:title" content="Lightsaber customiser" />
    <meta property="og:description" content="Build and customise your own lightsaber." />
    <meta property="og:image" content="https://lightsaber.darthperious.top/social-preview.jpg" />
    <meta property="og:image:alt" content="Preview image for you custom Lightsaber" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="512" />

    <!-- X/Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lightsaber customiser" />
    <meta name="twitter:description" content="Build and customise your own lightsaber." />
    <meta name="twitter:image" content="https://lightsaber.darthperious.top/social-preview.jpg" />
    <meta name="twitter:image:alt" content="Preview image for you custom Lightsaber" />

    <!-- Optional: your site's canonical URL -->
    <link rel="canonical" href="https://lightsaber.darthperious.top/" />

    <link href="img/icon.png" rel="icon" type="image/png" />
    <link href="style.css" rel="stylesheet" />
    <title>Lightsaber customiser</title>
    <script type="importmap">
      {
        "imports": {
          "openscad-cli-wrapper": "./node_modules/openscad-cli-wrapper/",
          "openscad-cli-wrapper/": "./node_modules/openscad-cli-wrapper/"
        }
      }
    </script>
  </head>
  <body class="dark">
    <h2>Lightsaber customiser</h2>
    <table>
      <tr>
        <td>
          <div>
            <label for="presetSelect">My sabers</label>
            <select id="presetSelect" name="presetSelect" onchange="gui.changePreset()">
              <option value="&lt;Default&gt;">&lt;Default&gt;</option>
            </select>
            <button onclick="gui.savePreset()">
              <img alt="save preset" class="save" src="img/save.svg" title="save preset" />
            </button>
            <button onclick="gui.export()">
              <img alt="export preset" class="save" src="img/export.svg" title="export preset" />
            </button>
            <button onclick="gui.delPreset()">
              <img alt="delete preset" class="save" src="img/del.svg" title="delete preset" />
            </button>
            <div>
              <label
                ><input
                  type="checkbox"
                  id="animate"
                  name="animate"
                  value="1"
                  onchange="gui.formChanged()"
                />animate</label
              >
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div id="main"></div>
        </td>
        <td>
          <div id="preview">
            <img alt="no preview" class="previewImage loadingImage" src="img/saber_empty.webp" title="no preview" />
          </div>
        </td>
      </tr>
    </table>
    <script>
      function toggle(event) {
        const element = event.target;
        element.classList.toggle("toggleShow");
        element.classList.toggle("toggleHide");
      }
    </script>
    <script type="module">
      import { Gui } from "./dist/Gui.js";
      import { PresetRepository } from "./dist/PresetRepository.js";
      import { BackendApi } from "./dist/serverApi/BackendApi.js";

      window.gui = new Gui(new PresetRepository(), new BackendApi());
    </script>
    <script src="lib/stl_viewer/stl_viewer.min.js"></script>
    <div>
      v<span id="version"></span>
      <a href="https://github.com/yannickbattail/laser-saber-customiser/issues/new">Report a bug</a>.
      <a href="https://github.com/yannickbattail/laser-saber-customiser">Sources on GitHub</a>
    </div>
  </body>
</html>
